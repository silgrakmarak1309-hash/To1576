<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Meri Local Bazaar - Buy & Sell Locally</title>
    <meta name="description" content="Local community marketplace for buying, selling, and connecting locally in your city." />
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#ea580c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meri Local Bazaar" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/app_logo.jpg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Plus Jakarta Sans", "system-ui", "-apple-system", "sans-serif"],
            },
            colors: {
              primary: {
                50: "#fff7ed",
                100: "#ffedd5",
                200: "#fed7aa",
                300: "#fdba74",
                400: "#fb923c",
                500: "#ea580c",
                600: "#c2410c",
                700: "#9a3412",
                800: "#7c2d12",
                900: "#431407",
              }
            }
          }
        }
      }
    </script>

    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        box-sizing: border-box;
      }
      :root {
        --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-top: env(safe-area-inset-top, 0px);
      }
      html {
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        margin: 0;
        padding: 0;
        width: 100%;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }
      body {
        font-family: inherit;
        background-color: #f8fafc;
        color: #0f172a;
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        width: 100%;
        min-height: 100vh;
      }
      /* Prevent elements from blowing out mobile width */
      img, video, canvas, svg {
        max-width: 100%;
      }
      .btn-primary {
        background-color: #ea580c;
        color: #ffffff;
        font-weight: 600;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.375rem;
        transition: all 0.2s ease;
        border: none;
        cursor: pointer;
      }
      .btn-primary:hover {
        background-color: #c2410c;
      }
      .btn-outline {
        background-color: transparent;
        color: #334155;
        border: 1px solid #cbd5e1;
        font-weight: 600;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.375rem;
        transition: all 0.2s ease;
        cursor: pointer;
      }
      .btn-outline:hover {
        background-color: #f1f5f9;
        border-color: #94a3b8;
      }
      .card {
        background-color: #ffffff;
        border-radius: 0.75rem;
        border: 1px solid #e2e8f0;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 0.125rem 0.5rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .input {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 0.5rem;
        padding: 0.5rem 0.75rem;
        font-size: 0.875rem;
        background-color: #ffffff;
        color: #0f172a;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .input:focus {
        border-color: #ea580c;
        box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.15);
      }
      .label {
        display: block;
        font-size: 0.8125rem;
        font-weight: 600;
        color: #334155;
        margin-bottom: 0.25rem;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-50 antialiased selection:bg-orange-100 selection:text-orange-900">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; background-color: #f8fafc; padding: 24px;">
        <div style="width: 52px; height: 52px; border: 4px solid #fed7aa; border-top-color: #ea580c; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="margin-top: 18px; font-size: 15px; font-weight: 600; color: #334155;">Opening Meri Local Bazaar...</p>
      </div>
    </div>
    <script src="/bundle.js"></script>
  </body>
</html>
